# Deploys the static documentation website to Cloudflare Pages: main to production (opsorama.dev), pull requests to preview URLs.
# Requires repository secrets CLOUDFLARE_API_TOKEN (Pages edit permission) and CLOUDFLARE_ACCOUNT_ID, and a Pages project named "opsorama-website".
# Pull requests from forks have no access to the secrets and skip the deployment.
# Disabled until the repository variable SITE_DEPLOY_ENABLED is set to true.
name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'tomulin1/opsorama' && vars.SITE_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:static
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # Wrangler runs through pnpm dlx at a pinned version: it is not a workspace dependency, so other jobs and contributors
      # do not install it. (cloudflare/wrangler-action cannot install Wrangler into a pnpm workspace root.)
      - run: pnpm dlx wrangler@4.158.0 pages deploy apps/site/out --project-name=opsorama-website --branch="$DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
