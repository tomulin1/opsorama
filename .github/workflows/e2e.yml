# Playwright end-to-end tests. They run on every push to a pull request (opened, new commits, reopened) and on demand
# (Actions → E2E → Run workflow); there is no scheduled run and no run after merging to main.
name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsorama/site exec playwright install --with-deps chromium
      # Tests run against the production build: the Playwright config starts `next start` on port 3101 and excludes the
      # `@measure` tests. WebGL runs through software rendering (SwiftShader).
      - run: pnpm --filter @opsorama/site build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm --filter @opsorama/site exec playwright test --shard=${{ matrix.shard }}/4
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/site/test-results
          retention-days: 7
