# Playwright end-to-end tests. They are slow, so they run on main, nightly, on demand, and on pull requests labelled "run-e2e".
name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsorama/site exec playwright install --with-deps chromium
      # The Playwright config starts the dev server; WebGL runs through software rendering (SwiftShader).
      - run: pnpm --filter @opsorama/site exec playwright test --shard=${{ matrix.shard }}/4
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/site/test-results
          retention-days: 7
